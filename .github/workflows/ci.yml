name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build -t threads-public-monitor:test .
      - run: docker run --rm --entrypoint sh threads-public-monitor:test -c 'command -v Xtigervnc && command -v websockify'
